<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { font-family: system-ui, sans-serif; width: 250px; margin: 0;
         background: #1a1a19; color: #e8e8e4; padding: 14px; }
  h1 { font-size: 13px; margin: 0 0 10px; }
  .stat { display: flex; justify-content: space-between; padding: 5px 0;
          border-top: 1px solid rgba(255,255,255,.1); font-size: 12px; }
  .stat b { font-variant-numeric: tabular-nums; }
  .track { height: 8px; background: #2c2c2a; border-radius: 5px; overflow: hidden; margin: 8px 0 4px; }
  .fill { height: 100%; border-radius: 5px; }
  label { display: flex; gap: 8px; align-items: center; font-size: 12px; margin-top: 10px; cursor: pointer; }
  a { color: #8ab4f8; font-size: 11.5px; }
  .foot { color: #8a8983; font-size: 10.5px; margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>
<h1>TokenTracker</h1>
<div class="stat"><span>This month (est.)</span><b id="mtd">0</b></div>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="stat" style="border:none; padding-top:0"><span id="pct" style="color:#8a8983">0%</span><span id="left" style="color:#8a8983">— left</span></div>
<div class="stat"><span>Messages this month</span><b id="msgs">0</b></div>
<div class="stat"><span>Quick fixes applied</span><b id="fixes">0</b></div>
<div class="stat"><span>Tokens saved (coaching)</span><b id="saved">0</b></div>
<label><input type="checkbox" id="enabled"> Coaching enabled</label>
<label><input type="checkbox" id="showBar"> Usage bar enabled</label>
<div class="foot">Usage is estimated and counted locally. <a href="#" id="opts">Options &amp; workspace setup →</a></div>
<script src="popup.js"></script>
</body>
</html>
